name: hair_salon_app
description: A new Flutter project.
version: 1.0.0+1
environment:
  #  sdk: '>=2.19.0 <3.0.0'
  sdk: ">=3.0.2 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  connectivity_plus: ^4.0.1
  shared_preferences: ^2.1.2
  cached_network_image: ^3.2.3
  flutter_svg:
  google_sign_in: ^6.1.4
  flutter_switch: ^0.3.2
  #  country_pickers: ^2.0.0
  smooth_page_indicator: ^1.1.0
  pin_code_fields: ^7.4.0
  sms_autofill: ^2.3.0
  pin_input_text_field: ^4.5.0
  flutter_svg_provider: ^1.0.3
  pinput: ^2.2.31
  readmore: ^2.2.0
  intl: ^0.18.1
  simple_gesture_detector: ^0.2.0
  #  buttons_tabbar: ^1.3.6
  #  table_calendar: ^3.0.9
  syncfusion_flutter_datepicker: ^22.1.34
  expandable_page_view: ^1.0.17



dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFProTextBold.ttf
          weight: 700
        - asset: assets/fonts/SFProTextRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProTextSemibold.ttf
          weight: 600
        - asset: assets/fonts/SFProTextMedium.ttf
          weight: 500
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplaySemibold.ttf
          weight: 600
    - family: Gilroy
      fonts:
        - asset: assets/fonts/GilroyBold.ttf
          weight: 700
