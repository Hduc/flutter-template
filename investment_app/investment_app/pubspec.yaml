name: investment_app
description: A new Flutter project.
version: 1.0.0+1
environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.4.0
  dotted_border: ^2.1.0
  flutter_svg_provider: ^1.0.7
  intl: ^0.19.0
  permission_handler: ^11.3.1
  slider_button: ^2.1.0
  candlesticks: ^2.1.0
  percent_indicator: ^4.2.3
  flutter_holo_date_picker: ^2.0.0
  syncfusion_flutter_charts: ^27.1.55
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterThin.ttf
          weight: 100
        - asset: assets/fonts/InterBold.ttf
          weight: 700
        - asset: assets/fonts/InterRegular.ttf
          weight: 400
        - asset: assets/fonts/InterMedium.ttf
          weight: 500
        - asset: assets/fonts/InterSemiBold.ttf
          weight: 600
