name: diet_app
description: A new Flutter project.
version: 1.0.0+1
environment:
  sdk: ">=3.2.5 <4.0.0"
dependencies: 
  flutter: 
    sdk: flutter
  get: ^4.6.6
#  connectivity_plus:
  dots_indicator: ^3.0.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_svg:
  url_launcher:
  pin_code_fields:
  flutter_svg_provider: ^1.0.7
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0
  sms_autofill: ^2.4.0
  intl: ^0.19.0
  pinput: ^5.0.0
  percent_indicator: ^4.2.3
  syncfusion_flutter_datepicker: ^26.2.11
dev_dependencies: 
  flutter_test: 
    sdk: flutter
flutter: 
  uses-material-design: true
  assets: 
    - assets/
    - assets/images/
  fonts: 
    - family: SF Pro Display
      fonts: 
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplayBold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplaySemibold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplayMedium.ttf
          weight: 500
    - family: SF Pro Text
      fonts: 
        - asset: assets/fonts/SFProTextSemibold.ttf
          weight: 600
    - family: Rubik
      fonts: 
        - asset: assets/fonts/RubikMedium.ttf
          weight: 500
