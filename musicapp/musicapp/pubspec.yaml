name: musicapp
description: A new Flutter project.
version: 1.0.0+1
environment:
  #  sdk: '>=2.19.1 <3.0.0'
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  connectivity_plus:
  shared_preferences:
  cached_network_image: ^3.4.1
  flutter_svg:
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.4.0
  pin_input_text_field: ^4.5.2
  flutter_svg_provider:
  intl: ^0.19.0
  colorful_safe_area: ^1.0.0
  carousel_slider: ^5.0.0
  #  pinput: ^2.2.31
  pinput:
  #  expansion_tile_group: ^1.2.1
#  flutter_share:
  share_plus: ^10.1.0
  flutter_rating_bar: ^4.0.1
  scroll_snap_list: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplayBold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplaySemibold.ttf
          weight: 600
    - family: AirbnbCereal_W_Bd
      fonts:
        - asset: assets/fonts/AirbnbCerealWBd.ttf
          weight: 700
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSansRegular.ttf
          weight: 400
        - asset: assets/fonts/OpenSansBold.ttf
          weight: 700
