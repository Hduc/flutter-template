name: flutter_salary_management_app
description: A new Flutter project.
version: 1.0.0+1
environment: 
  sdk: '>=3.4.3 <4.0.0'
dependencies: 
  flutter: 
    sdk: flutter
  get:
  connectivity_plus:
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  pinput: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.1.2
  syncfusion_flutter_charts: ^27.1.55
  fl_chart:
  pin_code_fields: ^8.0.1
  country_pickers: ^3.0.1
  country_code_picker: ^3.1.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  sms_autofill: ^2.4.0
  flutter_svg_provider:
  intl:
dev_dependencies: 
  flutter_test: 
    sdk: flutter
flutter: 
  uses-material-design: true
  assets: 
    - assets/
    - assets/images/
  fonts: 
    - family: SF Pro Display
      fonts: 
        - asset: assets/fonts/SFProDisplayBold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplaySemibold.ttf
          weight: 600
    - family: Neutrif Pro
      fonts: 
        - asset: assets/fonts/NeutrifProRegular.ttf
          weight: 400
    - family: Work Sans
      fonts: 
        - asset: assets/fonts/WorkSansBold.ttf
          weight: 700
    - family: Inter
      fonts: 
        - asset: assets/fonts/InterRegular.ttf
          weight: 400
        - asset: assets/fonts/InterBold.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts: 
        - asset: assets/fonts/PlusJakartaSansSemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSansRegular.ttf
          weight: 400
